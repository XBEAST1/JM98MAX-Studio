<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecd37a" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#d4af37" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Obsidian Machined Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#2b2b36" stroke-width="2" />
  
  <!-- Subtle Grid Reference Lines -->
  <line x1="8" y1="36" x2="56" y2="36" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="32" y1="12" x2="32" y2="52" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Biquad Response Curve (Champagne Gold) -->
  <path d="M 8 36 C 18 36, 22 18, 32 18 C 42 18, 46 36, 56 36" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#goldGlow)" />

  <!-- Master Center Node Handle -->
  <circle cx="32" cy="18" r="4.5" fill="#f5f5f7" stroke="#d4af37" stroke-width="2" />
</svg>
